name: Check Angular app

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install
      - uses: actions/upload-artifact@v6
        with:
          name: dependency-lock
          path: package-lock.json
          retention-days: 1
      - run: npm run build
      - run: npm test
